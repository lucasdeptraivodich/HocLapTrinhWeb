<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRƯỜNG CON CAFE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--1.điều hướng web-->
    <header>
        <div class="logo">TRUONG CON CAFE</div>
        <img src="images/Screenshot 2026-10-13 083647.png" alt="logo quán cafe" width="50px">
        <nav>
            <a href="#about">Về Chúng Tôi</a>
            <a href="#menu">Menu</a>
            <a href="#booking">Đặt Đồ</a>
            <a href="#contact">Liên Hệ</a>
        </nav>
    </header>




    <!--2.phần banner chính-->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>TRUONG CON CAFE</h1>
            <a href="#menu" class="btn-order">Xem Menu</a>
        </div>
    </section>
    <!--3.phần thực đơn-->
    <section id="menu" class="menu-container" <h2>Món nổi bật của quán</h2>
        <div class="menu-card">
            <h3>Đen đá sữa đặc</h3>
            <span class="price">35k</span>
        </div>
        <div class="menu-card">
            <h3>Espresso</h3>
            <span class="price">50k</span>
        </div>
        <div class="menu-card">
            <h3>Trà đào cam sả</h3>
            <span class="price">30k</span>
        </div>

    </section>
    <!--4.đáy trang-->
    <footer>
        <p>Mở cửa từ 9g sáng đến 11 giờ hàng ngày</p>

    </footer>
</body>

</html>
